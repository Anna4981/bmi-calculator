<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Enter your height and weight to find your Body Mass Index.</p>

    <form id="bmi-form" novalidate>
      <div class="field">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" placeholder="e.g. 170" step="any" inputmode="decimal">
        <span class="error" id="height-error" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight" placeholder="e.g. 65" step="any" inputmode="decimal">
        <span class="error" id="weight-error" aria-live="polite"></span>
      </div>

      <div class="buttons">
        <button type="submit" class="btn-primary">Calculate BMI</button>
        <button type="button" id="reset-btn" class="btn-secondary">Reset</button>
      </div>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <p class="result-label">Your BMI</p>
      <p class="bmi-value" id="bmi-value"></p>
      <p class="category" id="bmi-category"></p>
      <p class="message" id="bmi-message"></p>
    </section>

    <table class="legend">
      <caption>WHO BMI classification</caption>
      <tr><td>Below 18.5</td><td>Underweight</td></tr>
      <tr><td>18.5 – 24.9</td><td>Normal weight</td></tr>
      <tr><td>25 – 29.9</td><td>Overweight</td></tr>
      <tr><td>30 and above</td><td>Obese</td></tr>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
